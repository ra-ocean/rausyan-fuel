function nTime(t){if(!t)return"";const s=String(t);const m=s.match(/Date\(\d+,\d+,\d+,(\d+),(\d+)/);if(m)return`${String(m[1]).padStart(2,"0")}:${String(m[2]).padStart(2,"0")}`;if(/^\d{1,2}:\d{2}/.test(s))return s;return s}
function fixBF(v){const n=num(v);return(n>0&&n<1)?Math.round(n*1000)/10:n}
function fD(s){if(!s)return"";const d=new Date(s+"T00:00:00");return isNaN(d)?s:d.toLocaleDateString("id-ID",{weekday:"short",day:"numeric",month:"short"})}
function fDShort(s){if(!s)return"";const d=new Date(s+"T00:00:00");return isNaN(d)?s:d.toLocaleDateString("id-ID",{day:"numeric",month:"short"})}
function pct(v,t){return t===0?0:Math.min(Math.round((v/t)*100),150)}
function getDSum(data,date){const e=data.filter(d=>d.date===date);return{date,entries:e,calories:e.reduce((s,x)=>s+x.calories,0),protein:e.reduce((s,x)=>s+x.protein,0),fat:e.reduce((s,x)=>s+x.fat,0),carbs:e.reduce((s,x)=>s+x.carbs,0)}}
function uDates(data){return[...new Set(data.map(d=>d.date).filter(Boolean))].sort().reverse()}

// Get target for a specific date from target log
function getTargetForDate(targetLog, date) {
  if(!targetLog.length) return DEFAULTS;
  // Sort by date ascending
  const sorted = [...targetLog].sort((a,b) => a.date.localeCompare(b.date));
  // Find latest target that is <= date
  let result = sorted[0]; // default to earliest
  for(const t of sorted) {
    if(t.date <= date) result = t;
    else break;
  }
  return result;
}

// Get date range for week/month navigation
function getWeekRange(allDates, weekOffset) {
  // Get current week aligned to Sunday-Saturday
  const today = new Date((allDates[0] || new Date().toISOString().split("T")[0]) + "T00:00:00");
  // Find this week's Sunday
  const dayOfWeek = today.getDay(); // 0=Sunday
  const sunday = new Date(today);
  sunday.setDate(today.getDate() - dayOfWeek - weekOffset * 7);
  const saturday = new Date(sunday);
  saturday.setDate(sunday.getDate() + 6);
  const start = sunday.toISOString().split("T")[0];
  const end = saturday.toISOString().split("T")[0];
  return {start, end};
}

function getMonthRange(yearMonth) {
  // yearMonth = "2026-03"
  const [y,m] = yearMonth.split("-").map(Number);
  const start = `${y}-${String(m).padStart(2,"0")}-01`;
  const lastDay = new Date(y, m, 0).getDate();
  const end = `${y}-${String(m).padStart(2,"0")}-${String(lastDay).padStart(2,"0")}`;
  return {start, end};
}

function BarChart({data,targetLog,height=140}){
  if(!data.length)return null;
  const allCals = data.map(d=>d.calories);
  const allTargets = data.map(d=>{const t=getTargetForDate(targetLog,d.date);return t.calories});
  const mx=Math.max(...allCals,...allTargets)*1.15;
  return(
    <div style={{position:"relative",height}}>
      <div style={{display:"flex",alignItems:"flex-end",height:"100%",gap:3,padding:"0 2px"}}>
        {data.map((d,i)=>{
          const h=(d.calories/mx)*100;
          const target=allTargets[i];
          const over=d.calories>target;
          return(
            <div key={i} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",height:"100%",justifyContent:"flex-end",position:"relative"}}>
              <div style={{fontSize:9,fontWeight:700,color:over?C.coral:C.text,marginBottom:2,whiteSpace:"nowrap"}}>{d.calories>0?d.calories:""}</div>

            </div>

        })}
      </div>
    </div>
  )
}

function WeightChart({data}){if(data.length<2)return<div style={{padding:16,textAlign:"center",color:C.textLight}}>Minimal 2 data</div>;const w=data.map(d=>d.weight),mn=Math.min(...w)-0.3,mx=Math.max(...w)+0.3,rng=mx-mn;const svgW=Math.max(data.length*80,300),svgH=180,pad={top:28,bottom:45,left:10,right:10},cW=svgW-pad.left-pad.right,cH=svgH-pad.top-pad.bottom;const pts=data.map((d,i)=>({x:pad.left+(i/(data.length-1))*cW,y:pad.top+(1-(d.weight-mn)/rng)*cH,w:d.weight,dt:d.date}));const line=pts.map(p=>`${p.x},${p.y}`).join(" ");return(<div style={{overflowX:"auto"}}><svg width={svgW} height={svgH}><defs><linearGradient id="wg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={C.crimson} stopOpacity="0.12"/><stop offset="100%" stopColor={C.crimson} stopOpacity="0"/></linearGradient></defs><polygon points={`${pad.left},${svgH-pad.bottom} ${line} ${svgW-pad.right},${svgH-pad.bottom}`} fill="url(#wg)"/><polyline points={line} fill="none" stroke={C.crimson} strokeWidth="2.5" strokeLinejoin="round"/>{pts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="5" fill={C.crimson} stroke={C.cardBg} strokeWidth="2.5"/><text x={p.x} y={p.y-12} textAnchor="middle" fill={C.crimson} fontSize="11" fontWeight="700" fontFamily="Poppins">{p.w}</text><text x={p.x} y={svgH-pad.bottom+16} textAnchor="middle" fill={C.textMuted} fontSize="9" fontFamily="Poppins">{fD(p.dt)}</text></g>)}</svg></div>)}

function TrendChart({data,metrics,height=180,unitLabel="cm"}){const measured=data.filter(d=>d[metrics[0].key]>0);if(measured.length<2)return<div style={{padding:16,textAlign:"center",color:C.textLight}}>Minimal 2 data</div>;const[active,setActive]=useState(null);const vis=active?metrics.filter(m=>m.key===active):metrics;const allV=vis.flatMap(m=>measured.map(d=>d[m.key]).filter(v=>v>0));if(!allV.length)return null;const mn=Math.min(...allV)-1,mx=Math.max(...allV)+1,rng=mx-mn;const svgW=Math.max(measured.length*80,300),svgH=height,pad={top:30,bottom:45,left:10,right:15},cW=svgW-pad.left-pad.right,cH=svgH-pad.top-pad.bottom;return(<div><div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}><button onClick={()=>setActive(null)} style={{padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:"inherit",background:!active?C.crimson+"20":C.border,color:!active?C.crimson:C.textMuted}}>Semua</button>{metrics.map(m=><button key={m.key} onClick={()=>setActive(active===m.key?null:m.key)} style={{padding:"5px 10px",borderRadius:8,border:"none",cursor:"pointer",fontSize:10,fontWeight:600,fontFamily:"inherit",background:active===m.key?m.color+"25":C.border,color:active===m.key?m.color:C.textMuted}}>{m.label}</button>)}</div><div style={{overflowX:"auto"}}><svg width={svgW} height={svgH}>{[0,0.25,0.5,0.75,1].map((f,i)=>{const y=pad.top+f*cH;return<line key={i} x1={pad.left} y1={y} x2={svgW-pad.right} y2={y} stroke={C.border} strokeWidth="0.5"/>})}{vis.map(m=>{const pts=measured.map((d,i)=>({x:pad.left+(i/(measured.length-1))*cW,y:pad.top+(1-(d[m.key]-mn)/rng)*cH,v:d[m.key]}));const line=pts.map(p=>`${p.x},${p.y}`).join(" ");return<g key={m.key}><polyline points={line} fill="none" stroke={m.color} strokeWidth="2.5" strokeLinejoin="round"/>{pts.map((p,i)=><g key={i}><circle cx={p.x} cy={p.y} r="4.5" fill={m.color} stroke={C.cardBg} strokeWidth="2"/>{(vis.length===1||measured.length<=5)&&<text x={p.x} y={p.y-10} textAnchor="middle" fill={m.color} fontSize="10" fontWeight="700" fontFamily="Poppins">{p.v}</text>}</g>)}</g>})}{measured.map((d,i)=><text key={i} x={pad.left+(i/(measured.length-1))*cW} y={svgH-pad.bottom+18} textAnchor="middle" fill={C.textMuted} fontSize="9" fontFamily="Poppins">{fD(d.date)}</text>)}</svg></div><div style={{display:"flex",gap:12,marginTop:10,flexWrap:"wrap"}}>{vis.map(m=>{const delta=Math.round((measured[measured.length-1][m.key]-measured[0][m.key])*10)/10;return<div key={m.key} style={{display:"flex",alignItems:"center",gap:5}}><div style={{width:12,height:3,borderRadius:2,background:m.color}}/><span style={{fontSize:10,color:C.textMuted}}>{m.label}</span><span style={{fontSize:10,fontWeight:700,color:delta<0?C.green:delta>0?C.coral:C.textMuted}}>{delta>0?"+":""}{delta}{unitLabel}</span></div>})}</div></div>)}

    {lastRef&&<div style={{fontSize:10,color:C.textLight,textAlign:"right",marginBottom:8}}>Update: {lastRef.toLocaleTimeString("id-ID")} • {meals.length} meals • {weights.length} weights</div>}
    {/* Tabs */}
    <div style={{display:"flex",background:C.crimson+"08",borderRadius:12,padding:3,marginBottom:18}}>{tabs.map(t=><button key={t.k} onClick={()=>setView(t.k)} style={{flex:1,padding:"9px 0",border:"none",borderRadius:10,fontSize:12,fontWeight:600,textTransform:"uppercase",letterSpacing:"0.8px",cursor:"pointer",fontFamily:"inherit",transition:"all 0.2s",background:view===t.k?C.crimson:"transparent",color:view===t.k?"#fff":C.textMuted}}>{t.l}</button>)}</div>

    {/* DAILY */}
    {view==="daily"&&<>
      <NavBar label={fD(cd)} onPrev={()=>idx<dates.length-1&&setSelDate(dates[idx+1])} onNext={()=>idx>0&&setSelDate(dates[idx-1])}/>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
        <div style={{...sCard,padding:"26px 20px"}}><Ring consumed={daily.calories} target={T.calories}/><div style={{textAlign:"center",marginTop:10,fontSize:11,color:C.textMuted}}>{pct(daily.calories,T.calories)}% dari target harian</div></div>
        <div style={sCard}><div style={sLabel}>Macronutrients</div><MacroBar label="Protein" value={daily.protein} target={T.protein} color={C.green}/><MacroBar label="Carbs" value={daily.carbs} target={T.carbs} color={C.amber}/><MacroBar label="Fat" value={daily.fat} target={T.fat} color={C.orange}/></div>
      </div>
      <div style={sCard}><div style={sLabel}>Log Makanan</div><MealLog entries={daily.entries}/></div>
    </>}

    {/* WEEKLY */}
    {view==="weekly"&&<>
      <NavBar label={weekLabel} onPrev={()=>setWeekOff(weekOff+1)} onNext={()=>weekOff>0&&setWeekOff(weekOff-1)}/>
      <div style={{...sCard,display:"flex",justifyContent:"space-around",padding:"22px 16px"}}><Stat label="Avg Kkal" value={weekAvg.cal} sub={`target: ${weekAvg.target.calories}`}/><Stat label="On Target" value={`${weekAvg.onT}/${weekAvg.daysWithData}`} sub="hari (±10%)"/><Stat label="Avg Protein" value={`${weekAvg.pro}g`} sub={`target: ${weekAvg.target.protein}g`}/></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:14}}>
        <div style={sCard}><div style={sLabel}>Kalori Harian</div><BarChart data={weekData} targetLog={targetLog} height={160}/></div>
        <div style={sCard}><div style={sLabel}>Rata-rata Macro</div><MacroBar label="Protein" value={weekAvg.pro} target={weekAvg.target.protein} color={C.green}/><MacroBar label="Carbs" value={weekAvg.carb} target={weekAvg.target.carbs} color={C.amber}/><MacroBar label="Fat" value={weekAvg.fat} target={weekAvg.target.fat} color={C.orange}/></div>
      </div>
    </>}

    {/* MONTHLY */}
    {view==="monthly"&&<>
      <NavBar label={monthLabel} onPrev={()=>shiftMonth(-1)} onNext={()=>shiftMonth(1)}/>
      <div style={{...sCard,display:"flex",justifyContent:"space-around",padding:"22px 16px"}}><Stat label="Avg Kkal" value={monthAvg.cal} sub={`target: ${monthAvg.target.calories}`}/><Stat label="On Target" value={`${monthAvg.onT}/${monthAvg.daysWithData}`} sub="hari (±10%)"/><Stat label="Avg Protein" value={`${monthAvg.pro}g`} sub={`target: ${monthAvg.target.protein}g`}/></div>
      <div style={sCard}><div style={sLabel}>Kalori Harian</div><BarChart data={monthData} targetLog={targetLog} height={180}/></div>
      <div style={sCard}><div style={sLabel}>Rata-rata Macro</div><MacroBar label="Protein" value={monthAvg.pro} target={monthAvg.target.protein} color={C.green}/><MacroBar label="Carbs" value={monthAvg.carb} target={monthAvg.target.carbs} color={C.amber}/><MacroBar label="Fat" value={monthAvg.fat} target={monthAvg.target.fat} color={C.orange}/></div>
    </>}

    {/* BODY */}
    {view==="body"&&<>
      {lw&&<div style={{...sCard,padding:"24px 20px"}}><div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}><div><div style={sLabel}>Berat Badan Terakhir</div><div style={{fontSize:44,fontWeight:800,color:C.text,lineHeight:1,fontFamily:"'Crimson Pro',serif"}}>{lw.weight}<span style={{fontSize:18,fontWeight:400,color:C.textMuted,marginLeft:4}}>kg</span></div><div style={{marginTop:8,display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}><span style={{fontSize:12,fontWeight:600,color:wd<0?C.green:wd>0?C.coral:C.textMuted}}>{wd>0?"+":""}{wd} kg</span>{lw.stomach&&<span style={{fontSize:10,padding:"3px 8px",borderRadius:6,fontWeight:600,background:C.crimson+"10",color:C.textMuted}}>{lw.stomach}</span>}</div></div><div style={{textAlign:"right"}}><div style={{fontSize:10,color:C.textMuted}}>{fD(lw.date)}</div><div style={{fontSize:16,fontWeight:700,color:C.text,marginTop:2}}>{lw.time}</div></div></div></div>}
      {weights.length>0&&<div style={sCard}><div style={sLabel}>Tren Berat Badan</div><WeightChart data={weights}/></div>}
      {lw&&(lw.bodyFat>0||lw.visceralFat>0)&&<div style={sCard}><div style={sLabel}>Komposisi Tubuh</div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><MCard label="Body Fat" value={lw.bodyFat||null} unit="%" icon="🔥"/><MCard label="Visceral Fat" value={lw.visceralFat||null} unit="" icon="🫀"/><MCard label="Body Age" value={lw.bodyAge||null} unit="thn" icon="⏳"/></div></div>}
      {lm&&<div style={sCard}><div style={sLabel}>Pengukuran Terakhir — {fD(lm.date)}</div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}><MCard label="Dada" value={lm.chest||null} icon="📐"/><MCard label="Pinggang" value={lm.waist||null} icon="📏"/><MCard label="Perut" value={lm.belly||null} icon="📏"/></div><div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:8}}><MCard label="Lengan L" value={lm.armL||null} icon="💪"/><MCard label="Lengan R" value={lm.armR||null} icon="💪"/></div><div style={{display:"flex",gap:8,flexWrap:"wrap"}}><MCard label="Paha L" value={lm.thighL||null} icon="🦵"/><MCard label="Paha R" value={lm.thighR||null} icon="🦵"/><MCard label="Betis" value={lm.calf||null} icon="🦵"/></div></div>}
      {meas.length>=2&&<div style={sCard}><div style={sLabel}>Tren Lingkar Tubuh</div><TrendChart data={meas} unitLabel=" cm" metrics={[{key:"chest",label:"Dada",color:C.crimson},{key:"waist",label:"Pinggang",color:C.orange},{key:"belly",label:"Perut",color:C.coral},{key:"armL",label:"Arm L",color:C.green},{key:"armR",label:"Arm R",color:C.teal},{key:"thighL",label:"Paha L",color:C.amber},{key:"thighR",label:"Paha R",color:C.purple},{key:"calf",label:"Betis",color:C.crimsonLight}]}/></div>}
      {weights.filter(w=>w.bodyFat>0).length>=2&&<div style={sCard}><div style={sLabel}>Tren Komposisi Tubuh</div><TrendChart data={weights.filter(w=>w.bodyFat>0)} unitLabel="" metrics={[{key:"bodyFat",label:"Body Fat %",color:C.orange},{key:"visceralFat",label:"Visceral Fat",color:C.coral},{key:"bodyAge",label:"Body Age",color:C.purple}]}/></div>}
      {!lw&&!lm&&<div style={{...sCard,textAlign:"center",color:C.textMuted,fontSize:14,padding:40}}>Belum ada data body.</div>}
    </>}

    <div style={{textAlign:"center",padding:"24px 0 8px",fontSize:10,color:C.textLight}}>Project Rausyan Fuel v.1 • Live dari Google Sheets</div>
  </div>)
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script></body></html>
